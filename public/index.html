<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchPlug NG | Premium Timepieces</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-gold: #d97706;
            --accent-gold-hover: #b45309;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 1rem;
        }

        .header-logo {
            text-align: center;
            margin-top: 2rem;
        }

        .header-logo h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            color: var(--text-main);
        }

        .header-logo h1 span {
            color: var(--accent-gold);
        }

        .header-logo p {
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-size: 1rem;
        }

        .gateway-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .gateway-card h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .gateway-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: var(--accent-gold);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--accent-gold-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: #1f2937;
            border-color: #374151;
            transform: translateY(-2px);
        }

        .footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <div class="header-logo">
        <h1>WATCHPLUG <span>NG</span></h1>
        <p>Your Trusted Source for Authentic Wristwatches</p>
    </div>

    <div class="gateway-card">
        <h2>Welcome!</h2>
        <p>Please select an option below to continue</p>

        <div class="btn-group">
            <a href="/shop.html" class="btn btn-primary">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                </svg>
                I am a Customer
            </a>

            <!-- Direct link to admin.html -->
            <a href="/admin.html" class="btn btn-secondary">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
                WatchPlug Staff
            </a>
        </div>
    </div>

    <div class="footer">
        &copy; WatchPlug NG. All rights reserved.
    </div>

</body>
</html>
