<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Tracker</title>
<style>
  :root{ --bg:#f6f5f2; --card:#fff; --text:#1a1a1a; --muted:#6b6b6b; --accent:#8a5a2f; --accent-text:#fff; --border:#e2ded8; --danger:#b33; }
    @media (prefers-color-scheme: dark){
        :root{ --bg:#161513; --card:#221f1c; --text:#f2f0ec; --muted:#a9a49c; --accent:#d9975c; --accent-text:#1a1a1a; --border:#3a3530; }
          }
            *{box-sizing:border-box;}
              body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
                #app{max-width:520px;margin:0 auto;padding:20px 16px 60px;}
                  h1{font-size:1.25rem;margin:0 0 4px;}
                    .sub{color:var(--muted);font-size:.85rem;margin-bottom:20px;}
                      .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;}
                        label{display:block;font-size:.8rem;color:var(--muted);margin:12px 0 4px;}
                          input,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:1rem;}
                            button{background:var(--accent);color:var(--accent-text);border:none;border-radius:8px;padding:11px 16px;font-size:.95rem;font-weight:600;cursor:pointer;margin-top:14px;}
                              button.secondary{background:transparent;color:var(--text);border:1px solid var(--border);font-weight:500;}
                                .row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
                                  .tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;}
                                    .tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);font-size:.85rem;cursor:pointer;white-space:nowrap;}
                                      .tab.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent);}
                                        table{width:100%;border-collapse:collapse;font-size:.85rem;}
                                          th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--border);}
                                            th{color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase;}
                                              .table-wrap{overflow-x:auto;}
                                                .total-line{display:flex;justify-content:space-between;font-weight:700;margin-top:10px;padding-top:10px;border-top:2px solid var(--border);}
                                                  .err{color:var(--danger);font-size:.85rem;margin-top:8px;}
                                                    .empty{color:var(--muted);font-size:.85rem;text-align:center;padding:20px 0;}
                                                    </style>
                                                    </head>
                                                    <body>
                                                    <div id="app"><div class="empty">Loading…</div></div>
                                                    <script>
                                                    const CATEGORIES = ['Wrist Watches','Cufflinks','Jersey Scarves','Sneakers','Jewellery'];
                                                    const app = document.getElementById('app');
                                                    let user = null, token = localStorage.getItem('st_token');
                                                    let ownerTab = 'sales';
                                                    const money = n => '₦' + Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});
                                                    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
                                                    const catOpts = () => CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');

                                                    async function api(path, opts={}){
                                                      const headers = { 'Content-Type':'application/json' };
                                                        if(token) headers['Authorization'] = 'Bearer ' + token;
                                                          const res = await fetch('/api/' + path, { ...opts, headers });
                                                            const data = await res.json().catch(()=>({}));
                                                              if(!res.ok) throw new Error(data.error || 'Something went wrong.');
                                                                return data;
                                                                }

                                                                async function boot(){
                                                                  if(token){
                                                                      try{ user = await api('me'); }
                                                                          catch(e){ token = null; localStorage.removeItem('st_token'); }
                                                                            }
                                                                              if(!user){
                                                                                  try{
                                                                                        const { exists } = await api('has-workers');
                                                                                              if(!exists){ renderSetup(); return; }
                                                                                                  }catch(e){}
                                                                                                      renderLogin();
                                                                                                          return;
                                                                                                            }
                                                                                                              render();
                                                                                                              }

                                                                                                              function render(){ user.role === 'owner' ? renderOwner() : renderWorker(); }

                                                                                                              function renderSetup(){
                                                                                                                app.innerHTML = `
                                                                                                                    <h1>Sales Tracker</h1>
                                                                                                                        <div class="sub">First-time setup — create your owner account</div>
                                                                                                                            <div class="card">
                                                                                                                                  <label>Your name</label><input id="s-name">
                                                                                                                                        <label>Username</label><input id="s-user">
                                                                                                                                              <label>Password</label><input id="s-pass" type="password">
                                                                                                                                                    <div id="s-err" class="err"></div>
                                                                                                                                                          <button id="s-btn">Create owner account</button>
                                                                                                                                                              </div>`;
                                                                                                                                                                document.getElementById('s-btn').onclick = async () => {
                                                                                                                                                                    const name = document.getElementById('s-name').value.trim();
                                                                                                                                                                        const username = document.getElementById('s-user').value.trim();
                                                                                                                                                                            const password = document.getElementById('s-pass').value;
                                                                                                                                                                                const errEl = document.getElementById('s-err');
                                                                                                                                                                                    if(!name || !username || !password){ errEl.textContent = 'Fill in all fields.'; return; }
                                                                                                                                                                                        try{
                                                                                                                                                                                              await api('setup', { method:'POST', body: JSON.stringify({name, username, password}) });
                                                                                                                                                                                                    const r = await api('login', { method:'POST', body: JSON.stringify({username, password}) });
                                                                                                                                                                                                          token = r.token; localStorage.setItem('st_token', token); user = r;
                                                                                                                                                                                                                render();
                                                                                                                                                                                                                    }catch(e){ errEl.textContent = e.message; }
                                                                                                                                                                                                                      };
                                                                                                                                                                                                                      }

                                                                                                                                                                                                                      function renderLogin(){
                                                                                                                                                                                                                        app.innerHTML = `
                                                                                                                                                                                                                            <h1>Sales Tracker</h1>
                                                                                                                                                                                                                                <div class="sub">Log in to record or view sales</div>
                                                                                                                                                                                                                                    <div class="card">
                                                                                                                                                                                                                                          <label>Username</label><input id="l-user" autocapitalize="none">
                                                                                                                                                                                                                                                <label>Password</label><input id="l-pass" type="password">
                                                                                                                                                                                                                                                      <div id="l-err" class="err"></div>
                                                                                                                                                                                                                                                            <button id="l-btn">Log in</button>
                                                                                                                                                                                                                                                                </div>`;
                                                                                                                                                                                                                                                                  const doLogin = async () => {
                                                                                                                                                                                                                                                                      const username = document.getElementById('l-user').value.trim();
                                                                                                                                                                                                                                                                          const password = document.getElementById('l-pass').value;
                                                                                                                                                                                                                                                                              const errEl = document.getElementById('l-err');
                                                                                                                                                                                                                                                                                  try{
                                                                                                                                                                                                                                                                                        const r = await api('login', { method:'POST', body: JSON.stringify({username, password}) });
                                                                                                                                                                                                                                                                                              token = r.token; localStorage.setItem('st_token', token); user = r;
                                                                                                                                                                                                                                                                                                    render();
                                                                                                                                                                                                                                                                                                        }catch(e){ errEl.textContent = e.message; }
                                                                                                                                                                                                                                                                                                          };
                                                                                                                                                                                                                                                                                                            document.getElementById('l-btn').onclick = doLogin;
                                                                                                                                                                                                                                                                                                              document.getElementById('l-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                              async function logout(){
                                                                                                                                                                                                                                                                                                                try{ await api('logout', { method:'POST' }); }catch(e){}
                                                                                                                                                                                                                                                                                                                  token = null; user = null; localStorage.removeItem('st_token');
                                                                                                                                                                                                                                                                                                                    renderLogin();
                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                    function saleFormHtml(){
                                                                                                                                                                                                                                                                                                                      return `
                                                                                                                                                                                                                                                                                                                          <label>Category</label><select id="w-cat">${catOpts()}</select>
                                                                                                                                                                                                                                                                                                                              <label>Item</label><input id="w-item" placeholder="e.g. Silver cufflink set">
                                                                                                                                                                                                                                                                                                                                  <label>Price (per item)</label><input id="w-price" type="number" min="0" step="0.01">
                                                                                                                                                                                                                                                                                                                                      <label>Quantity</label><input id="w-qty" type="number" min="1" value="1">
                                                                                                                                                                                                                                                                                                                                          <div id="w-err" class="err"></div>
                                                                                                                                                                                                                                                                                                                                              <button id="w-btn">Log sale</button>`;
                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                              function wireSaleForm(onDone){
                                                                                                                                                                                                                                                                                                                                                document.getElementById('w-btn').onclick = async () => {
                                                                                                                                                                                                                                                                                                                                                    const category = document.getElementById('w-cat').value;
                                                                                                                                                                                                                                                                                                                                                        const item = document.getElementById('w-item').value.trim();
                                                                                                                                                                                                                                                                                                                                                            const price = parseFloat(document.getElementById('w-price').value);
                                                                                                                                                                                                                                                                                                                                                                const qty = parseInt(document.getElementById('w-qty').value, 10) || 1;
                                                                                                                                                                                                                                                                                                                                                                    const errEl = document.getElementById('w-err');
                                                                                                                                                                                                                                                                                                                                                                        if(!item || isNaN(price) || price < 0){ errEl.textContent = 'Fill in item and a valid price.'; return; }
                                                                                                                                                                                                                                                                                                                                                                            try{
                                                                                                                                                                                                                                                                                                                                                                                  await api('sales', { method:'POST', body: JSON.stringify({category, item, price, qty}) });
                                                                                                                                                                                                                                                                                                                                                                                        onDone();
                                                                                                                                                                                                                                                                                                                                                                                            }catch(e){ errEl.textContent = e.message; }
                                                                                                                                                                                                                                                                                                                                                                                              };
                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                              async function renderWorker(){
                                                                                                                                                                                                                                                                                                                                                                                                app.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                    <div class="row"><h1>Hi, ${esc(user.name)}</h1><button class="secondary" id="lo-btn">Log out</button></div>
                                                                                                                                                                                                                                                                                                                                                                                                        <div class="sub">Log a sale</div>
                                                                                                                                                                                                                                                                                                                                                                                                            <div class="card">${saleFormHtml()}</div>
                                                                                                                                                                                                                                                                                                                                                                                                                <div class="sub">Your recent sales</div>
                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="card table-wrap" id="w-list"><div class="empty">Loading…</div></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                      document.getElementById('lo-btn').onclick = logout;
                                                                                                                                                                                                                                                                                                                                                                                                                        wireSaleForm(renderWorker);
                                                                                                                                                                                                                                                                                                                                                                                                                          try{
                                                                                                                                                                                                                                                                                                                                                                                                                              const mine = await api('sales');
                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById('w-list').innerHTML = mine.length ? salesTable(mine, false) : '<div class="empty">No sales logged yet.</div>';
                                                                                                                                                                                                                                                                                                                                                                                                                                    }catch(e){}
                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                    function salesTable(list, showWorker){
                                                                                                                                                                                                                                                                                                                                                                                                                                      return `<table><thead><tr>${showWorker?'<th>Worker</th>':''}<th>Item</th><th>Cat.</th><th>Qty</th><th>Total</th><th>When</th></tr></thead><tbody>
                                                                                                                                                                                                                                                                                                                                                                                                                                          ${list.map(s => `<tr>${showWorker?`<td>${esc(s.worker_name)}</td>`:''}<td>${esc(s.item)}</td><td>${esc(s.category)}</td><td>${s.qty}</td><td>${money(s.total)}</td><td>${new Date(s.timestamp).toLocaleDateString()}</td></tr>`).join('')}
                                                                                                                                                                                                                                                                                                                                                                                                                                              </tbody></table>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                              function stockTable(list){
                                                                                                                                                                                                                                                                                                                                                                                                                                                return `<table><thead><tr><th>Item</th><th>Cat.</th><th>Vendor</th><th>Qty</th><th>Added by</th><th>When</th></tr></thead><tbody>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    ${list.map(s => `<tr><td>${esc(s.item)}</td><td>${esc(s.category)}</td><td>${esc(s.vendor||'—')}</td><td>${s.qty}</td><td>${esc(s.added_by)}</td><td>${new Date(s.timestamp).toLocaleDateString()}</td></tr>`).join('')}
                                                                                                                                                                                                                                                                                                                                                                                                                                                        </tbody></table>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                        async function renderOwner(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                          app.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="row"><h1>Owner Dashboard</h1><button class="secondary" id="lo-btn">Log out</button></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="tabs">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="tab ${ownerTab==='sales'?'active':''}" data-tab="sales">All Sales</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="tab ${ownerTab==='stock'?'active':''}" data-tab="stock">Stock Intake</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="tab ${ownerTab==='workers'?'active':''}" data-tab="workers">Workers</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="tab ${ownerTab==='log'?'active':''}" data-tab="log">Log a Sale</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div id="tab-content"><div class="empty">Loading…</div></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('lo-btn').onclick = logout;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      app.querySelectorAll('.tab').forEach(t => t.onclick = () => { ownerTab = t.dataset.tab; renderOwner(); });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        await renderOwnerTab();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        async function renderOwnerTab(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const el = document.getElementById('tab-content');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(ownerTab === 'sales'){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                try{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const list = await api('sales');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const total = list.reduce((s,x) => s + (x.total||0), 0);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  el.innerHTML = `<div class="card table-wrap">${list.length ? salesTable(list, true) : '<div class="empty">No sales logged yet.</div>'}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ${list.length ? `<div class="total-line"><span>Total revenue</span><span>${money(total)}</span></div>` : ''}</div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }catch(e){ el.innerHTML = `<div class="err">${e.message}</div>`; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } else if(ownerTab === 'stock'){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    el.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <label>Category</label><select id="st-cat">${catOpts()}</select>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <label>Item</label><input id="st-item" placeholder="e.g. Leather strap watches">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <label>Vendor</label><input id="st-vendor" placeholder="e.g. Lagos Imports Ltd">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <label>Quantity received</label><input id="st-qty" type="number" min="1" value="1">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <label>Cost price (per item, optional)</label><input id="st-cost" type="number" min="0" step="0.01">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div id="st-err" class="err"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <button id="st-btn">Add stock</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="sub">Recent stock intake</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="card table-wrap" id="st-list"><div class="empty">Loading…</div></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('st-btn').onclick = async () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const category = document.getElementById('st-cat').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const item = document.getElementById('st-item').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const vendor = document.getElementById('st-vendor').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const qty = parseInt(document.getElementById('st-qty').value, 10);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const cost_price = parseFloat(document.getElementById('st-cost').value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const errEl = document.getElementById('st-err');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if(!item || !qty || qty <= 0){ errEl.textContent = 'Fill in item and a valid quantity.'; return; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        try{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                await api('stock', { method:'POST', body: JSON.stringify({category, item, vendor, qty, cost_price: isNaN(cost_price)?null:cost_price}) });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        renderOwnerTab();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }catch(e){ errEl.textContent = e.message; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      try{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const list = await api('stock');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById('st-list').innerHTML = list.length ? stockTable(list) : '<div class="empty">No stock added yet.</div>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }catch(e){}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } else if(ownerTab === 'workers'){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            el.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="card" id="wk-existing"><div class="empty">Loading…</div></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="sub">Add a worker</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <label>Name</label><input id="nw-name">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <label>Username</label><input id="nw-user">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <label>Password</label><input id="nw-pass" type="password">
