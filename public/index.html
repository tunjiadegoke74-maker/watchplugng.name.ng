<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WatchPlugNG — Sales & Stock Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #241F16;
    --ink-muted: #7A7361;
    --paper: #FAF7F0;
    --card: #FFFFFF;
    --line: #E7DFCB;
    --gold: #8B6F2F;
    --gold-light: #C9A76A;
    --gold-hover: #6F5824;
    --input-bg: #FBF9F3;
    --focus: rgba(139, 111, 47, 0.35);
    --danger: #b33;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Manrope', sans-serif;
  }

  #app {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .dial {
    position: relative;
    width: 100px;
    height: 100px;
    margin-bottom: 20px;
    flex-shrink: 0;
  }
  .dial-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(139, 111, 47, 0.35);
  }
  .tick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 2px;
    border-radius: 1px;
    transform-origin: 50% 50%;
  }
  .tick.major { height: 15px; background: var(--gold); }
  .tick.minor { height: 8px; width: 1.5px; background: #C9BFA0; }
  .hand {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 2px;
    height: 33px;
    background: var(--gold);
    border-radius: 1px;
    transform-origin: 50% 100%;
    transform: translate(-50%, -100%) rotate(0deg);
    animation: sweep 9s linear infinite;
  }
  .pivot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 6px;
    height: 6px;
    background: var(--gold);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  @keyframes sweep {
    from { transform: translate(-50%, -100%) rotate(0deg); }
    to   { transform: translate(-50%, -100%) rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hand { animation: none; }
  }

  .screen {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1.wordmark {
    margin: 0;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 26px;
    text-align: center;
  }
  .subtitle {
    margin-top: 4px;
    font-size: 13px;
    color: var(--ink-muted);
    text-align: center;
  }

  .card {
    margin-top: 24px;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; color: var(--ink-muted); }

  input, select {
    height: 46px;
    width: 100%;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--input-bg);
    color: var(--ink);
    font-size: 15px;
    font-family: 'Manrope', sans-serif;
    padding: 0 14px;
  }
  input::placeholder { color: #A79F8B; }
  input:focus, select:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--focus);
  }

  .password-wrap { position: relative; width: 100%; }
  .password-wrap input { padding-right: 42px; }
  .toggle-visibility {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink-muted);
    border-radius: 8px;
  }

  button.submit {
    margin-top: 4px;
    height: 46px;
    border-radius: 10px;
    border: none;
    background: var(--gold);
    color: #FFFDF8;
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button.submit:hover { background: var(--gold-hover); }

  button.secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-group { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--input-bg); cursor: pointer; }
  .btn-sm.active { background: var(--gold); color: white; border-color: var(--gold); }

  .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .footnote {
    margin-top: 30px;
    font-size: 11px;
    letter-spacing: 0.3px;
    color: #B3AB94;
    text-align: center;
  }

  .dashboard { width: 100%; max-width: 600px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .tabs { display: flex; gap: 8px; margin: 16px 0; overflow-x: auto; }
  .tab { padding: 8px 14px; border-radius: 20px; border: 1px solid var(--line); font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
  .tab.active { background: var(--gold); color: #fff; border-color: var(--gold); }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--ink-muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
  .table-wrap { overflow-x: auto; }
  .total-card { background: var(--input-bg); padding: 12px; border-radius: 10px; border: 1px solid var(--line); margin-top: 10px; display: flex; justify-content: space-between; font-weight: 700; }
  .err { color: var(--danger); font-size: 0.85rem; margin-top: 4px; }
  .empty { color: var(--ink-muted); font-size: 0.85rem; text-align: center; padding: 20px 0; }
  .badge { background: #E7DFCB; color: #241F16; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
</style>
</head>
<body>

<div id="app"><div class="empty">Loading…</div></div>

<script>
const CATEGORIES = ['Wrist Watches','Cufflinks','Jersey Scarves','Sneakers','Jewellery'];
const app = document.getElementById('app');
let user = null, token = localStorage.getItem('st_token');
let ownerTab = 'reports';

const money = function(n){ return '₦' + Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2}); };
const esc = function(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
const catOpts = function(includeAll){ 
  var opts = CATEGORIES.map(function(c){ return '<option value="' + c + '">' + c + '</option>'; }).join('');
  return includeAll ? '<option value="">All Categories</option>' + opts : opts;
};

function brandDialHeader(){
  return '<div class="dial" aria-hidden="true">' +
    '<div class="dial-ring"></div>' +
    '<div class="tick major" style="transform: rotate(0deg) translateY(-40px);"></div>' +
    '<div class="tick major" style="transform: rotate(90deg) translateY(-40px);"></div>' +
    '<div class="tick major" style="transform: rotate(180deg) translateY(-40px);"></div>' +
    '<div class="tick major" style="transform: rotate(270deg) translateY(-40px);"></div>' +
    '<div class="tick minor" style="transform: rotate(30deg) translateY(-43px);"></div>' +
    '<div class="tick minor" style="transform: rotate(60deg) translateY(-43px);"></div>' +
    '<div class="tick minor" style="transform: rotate(120deg) translateY(-43px);"></div>' +
    '<div class="tick minor" style="transform: rotate(150deg) translateY(-43px);"></div>' +
    '<div class="tick minor" style="transform: rotate(210deg) translateY(-43px);"></div>' +
    '<div class="tick minor" style="transform: rotate(240deg) translateY(-43px);"></div>' +
    '<div class="tick minor" style="transform: rotate(300deg) translateY(-43px);"></div>' +
    '<div class="tick minor" style="transform: rotate(330deg) translateY(-43px);"></div>' +
    '<div class="hand"></div>' +
    '<div class="pivot"></div>' +
  '</div>' +
  '<h1 class="wordmark">WatchPlugNG</h1>';
}

function pwdInputHtml(id, placeholder){
  var ph = placeholder || 'Password';
  return '<div class="password-wrap">' +
    '<input id="' + id + '" type="password" placeholder="' + ph + '" required>' +
    '<button type="button" class="toggle-visibility" onclick="togglePwd(\'' + id + '\', this)">' +
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>' +
    '</button>' +
  '</div>';
}

function togglePwd(inputId, btn){
  var el = document.getElementById(inputId);
  var isHidden = el.type === 'password';
  el.type = isHidden ? 'text' : 'password';
  btn.querySelector('svg').innerHTML = isHidden 
    ? '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a20.6 20.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" /><line x1="1" y1="1" x2="23" y2="23"/>'
    : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>';
}

async function api(path, opts){
  opts = opts || {};
  var headers = { 'Content-Type':'application/json' };
  if(token) headers['Authorization'] = 'Bearer ' + token;
  var res = await fetch('/api/' + path, Object.assign({}, opts, { headers: headers }));
  var data = await res.json().catch(function(){ return {}; });
  if(!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

async function boot(){
  if(token){
    try{ user = await api('me'); }
    catch(e){ token = null; localStorage.removeItem('st_token'); }
  }
  if(!user){
    try{
      var res = await api('has-workers');
      if(!res.exists){ renderSetup(); return; }
    }catch(e){}
    renderLogin();
    return;
  }
  render();
}

function render(){ user.role === 'owner' ? renderOwner() : renderWorker(); }

function renderSetup(){
  app.innerHTML = '<div class="screen">' +
    brandDialHeader() +
    '<div class="subtitle">First-time setup — create your owner account</div>' +
    '<form class="card" id="setupForm">' +
      '<div class="field"><label>Your name</label><input id="s-name" required></div>' +
      '<div class="field"><label>Username</label><input id="s-user" required></div>' +
      '<div class="field"><label>Password</label>' + pwdInputHtml('s-pass') + '</div>' +
      '<div id="s-err" class="err"></div>' +
      '<button type="submit" class="submit">Create owner account</button>' +
    '</form>' +
    '<div class="footnote">Every second, tracked.</div>' +
  '</div>';

  document.getElementById('setupForm').onsubmit = async function(e){
    e.preventDefault();
    try{
      await api('setup', { method:'POST', body: JSON.stringify({name: document.getElementById('s-name').value.trim(), username: document.getElementById('s-user').value.trim(), password: document.getElementById('s-pass').value}) });
      var r = await api('login', { method:'POST', body: JSON.stringify({username: document.getElementById('s-user').value.trim(), password: document.getElementById('s-pass').value}) });
      token = r.token; localStorage.setItem('st_token', token); user = r;
      render();
    }catch(err){ document.getElementById('s-err').textContent = err.message; }
  };
}

function renderLogin(){
  app.innerHTML = '<div class="screen">' +
    brandDialHeader() +
    '<div class="subtitle">Log in to record or view sales</div>' +
    '<form class="card" id="loginForm">' +
      '<div class="field"><label>Username</label><input id="l-user" required></div>' +
      '<div class="field"><label>Password</label>' + pwdInputHtml('l-pass') + '</div>' +
      '<div id="l-err" class="err"></div>' +
      '<button type="submit" class="submit">Log in</button>' +
    '</form>' +
    '<div class="footnote">Every second, tracked.</div>' +
  '</div>';

  document.getElementById('loginForm').onsubmit = async function(e){
    e.preventDefault();
    try{
      var r = await api('login', { method:'POST', body: JSON.stringify({username: document.getElementById('l-user').value.trim(), password: document.getElementById('l-pass').value}) });
      token = r.token; localStorage.setItem('st_token', token); user = r;
      render();
    }catch(err){ document.getElementById('l-err').textContent = err.message; }
  };
}

async function logout(){
  try{ await api('logout', { method:'POST' }); }catch(e){}
  token = null; user = null; localStorage.removeItem('st_token');
  renderLogin();
}

function saleFormHtml(){
  return '<div class="field"><label>Category</label><select id="w-cat">' + catOpts(false) + '</select></div>' +
    '<div class="field"><label>Item Name</label><input id="w-item" placeholder="e.g. Silver cufflink set"></div>' +
    '<div class="field"><label>Price (per item)</label><input id="w-price" type="number" min="0" step="0.01"></div>' +
    '<div class="field"><label>Quantity</label><input id="w-qty" type="number" min="1" value="1"></div>' +
    '<div id="w-err" class="err"></div>' +
    '<button type="button" class="submit" id="w-btn">Log Sale</button>';
}

function wireSaleForm(onDone){
  document.getElementById('w-btn').onclick = async function(){
    var category = document.getElementById('w-cat').value;
    var item = document.getElementById('w-item').value.trim();
    var price = parseFloat(document.getElementById('w-price').value);
    var qty = parseInt(document.getElementById('w-qty').value, 10) || 1;
    var errEl = document.getElementById('w-err');
    if(!item || isNaN(price) || price < 0){ errEl.textContent = 'Fill in item and a valid price.'; return; }
    try{
      await api('sales', { method:'POST', body: JSON.stringify({category: category, item: item, price: price, qty: qty}) });
      onDone();
    }catch(err){ errEl.textContent = err.message; }
  };
}

async function renderWorker(){
  app.innerHTML = '<div class="dashboard">' +
    '<div class="row"><h1>Hi, ' + esc(user.name) + '</h1><button class="secondary" onclick="logout()">Log out</button></div>' +
    '<div class="subtitle" style="text-align:left; margin-bottom: 12px;">Log a sale</div>' +
    '<div class="card">' + saleFormHtml() + '</div>' +
    '<div class="subtitle" style="text-align:left; margin: 20px 0 12px;">Your recent sales</div>' +
    '<div class="card table-wrap" id="w-list"><div class="empty">Loading…</div></div>' +
  '</div>';

  wireSaleForm(renderWorker);
  try{
    var mine = await api('sales');
    document.getElementById('w-list').innerHTML = mine.length ? salesTable(mine, false) : '<div class="empty">No sales logged yet.</div>';
  }catch(e){}
}

function salesTable(list, showWorker){
  var rows = list.map(function(s){
    return '<tr>' + (showWorker ? '<td>' + esc(s.worker_name) + '</td>' : '') + '<td>' + esc(s.item) + '</td><td>' + esc(s.category) + '</td><td>' + s.qty + '</td><td>' + money(s.total) + '</td><td>' + new Date(s.timestamp).toLocaleDateString() + '</td></tr>';
  }).join('');
  return '<table><thead><tr>' + (showWorker ? '<th>Worker</th>' : '') + '<th>Item</th><th>Cat</th><th>Qty</th><th>Total</th><th>When</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

async function renderOwner(){
  app.innerHTML = '<div class="dashboard">' +
    '<div class="row"><h1>Owner Dashboard</h1><button class="secondary" onclick="logout()">Log out</button></div>' +
    '<div class="tabs">' +
      '<div class="tab ' + (ownerTab==='reports'?'active':'') + '" onclick="switchTab(\'reports\')">📊 Reports</div>' +
      '<div class="tab ' + (ownerTab==='stock'?'active':'') + '" onclick="switchTab(\'stock\')">Stock Intake</div>' +
      '<div class="tab ' + (ownerTab==='workers'?'active':'') + '" onclick="switchTab(\'workers\')">Workers</div>' +
      '<div class="tab ' + (ownerTab==='log'?'active':'') + '" onclick="switchTab(\'log\')">Log Sale</div>' +
    '</div>' +
    '<div id="tab-content"></div>' +
  '</div>';
  await renderOwnerTab();
}

function switchTab(t){ ownerTab = t; renderOwner(); }

async function renderOwnerTab(){
  var el = document.getElementById('tab-content');
  if(ownerTab === 'reports'){
    el.innerHTML = '<div class="card">' +
      '<div class="field"><label>Report Type</label><select id="rpt-type" onchange="toggleReportFields(); runReport();"><option value="sales">Sales Revenue Report</option><option value="stock">Stock Intake Report</option></select></div>' +
      '<label>Date Range Quick Filters</label>' +
      '<div class="btn-group">' +
        '<button class="btn-sm" onclick="setPreset(\'today\')">Today</button>' +
        '<button class="btn-sm" onclick="setPreset(\'week\')">This Week</button>' +
        '<button class="btn-sm" onclick="setPreset(\'month\')">This Month</button>' +
        '<button class="btn-sm" onclick="setPreset(\'year\')">This Year</button>' +
        '<button class="btn-sm" onclick="setPreset(\'all\')">All Time</button>' +
      '</div>' +
      '<div class="filter-grid">' +
        '<div class="field"><label>From Date</label><input type="date" id="rpt-from" onchange="runReport()"></div>' +
        '<div class="field"><label>To Date</label><input type="date" id="rpt-to" onchange="runReport()"></div>' +
      '</div>' +
      '<div class="filter-grid">' +
        '<div class="field"><label>Category</label><select id="rpt-cat" onchange="runReport()">' + catOpts(true) + '</select></div>' +
        '<div class="field" id="vendor-filter-box" style="display:none;"><label>Vendor Filter</label><input id="rpt-vendor" placeholder="Vendor name..." oninput="runReport()"></div>' +
      '</div>' +
    '</div>' +
    '<div class="card table-wrap" id="rpt-results"><div class="empty">Loading report...</div></div>';

    setPreset('month');
  } else if(ownerTab === 'stock'){
    el.innerHTML = '<div class="card">' +
      '<h3>Add Stock Intake</h3>' +
      '<div class="field"><label>Category</label><select id="st-cat">' + catOpts(false) + '</select></div>' +
      '<div class="field"><label>Item Name</label><input id="st-item" placeholder="Item name"></div>' +
      '<div class="field"><label>Vendor</label><input id="st-vendor" placeholder="Supplier name"></div>' +
      '<div class="field"><label>Quantity</label><input id="st-qty" type="number" value="1"></div>' +
      '<button type="button" class="submit" id="st-btn">Save Stock Intake</button>' +
    '</div>';
    document.getElementById('st-btn').onclick = async function(){
      await api('stock', { method:'POST', body: JSON.stringify({
        category: document.getElementById('st-cat').value,
        item: document.getElementById('st-item').value,
        vendor: document.getElementById('st-vendor').value,
        qty: parseInt(document.getElementById('st-qty').value, 10)
      })});
      alert('Stock added successfully!');
    };
  } else if(ownerTab === 'workers'){
    el.innerHTML = '<div class="card">' +
      '<h3>Add New Worker</h3>' +
      '<div class="field"><label>Full Name</label><input id="nw-name" placeholder="Worker\'s full name"></div>' +
      '<div class="field"><label>Username</label><input id="nw-user" placeholder="Login username"></div>' +
      '<div class="field"><label>Password</label>' + pwdInputHtml('nw-pass', 'Set password') + '</div>' +
      '<div id="nw-err" class="err"></div>' +
      '<button type="button" class="submit" onclick="addWorker()">Create Worker Account</button>' +
    '</div>' +
    '<div class="card">' +
      '<h3>Reset Worker Password</h3>' +
      '<div class="field"><label>Username</label><input id="rw-user" placeholder="Worker username"></div>' +
      '<div class="field"><label>New Password</label>' + pwdInputHtml('rw-pass', 'New Password') + '</div>' +
      '<div id="rw-err" class="err"></div>' +
      '<button type="button" class="submit" onclick="resetWorkerPwd()">Reset Password</button>' +
    '</div>' +
    '<div class="card table-wrap" id="workers-list-card">' +
      '<h3>Team Activity Roster</h3>' +
      '<div id="workers-table-box"><div class="empty">Loading workers list...</div></div>' +
    '</div>';

    loadWorkersRoster();
  } else if(ownerTab === 'log'){
    el.innerHTML = '<div class="card">' + saleFormHtml() + '</div>';
    wireSaleForm(function(){ ownerTab = 'reports'; renderOwner(); });
  }
}

async function loadWorkersRoster(){
  try{
    var list = await api('workers');
    var target = document.getElementById('workers-table-box');
    if(!list.length){
      target.innerHTML = '<div class="empty">No workers found.</div>';
      return;
    }
    
    var rows = list.map(function(w){
      var created = w.created_at ? new Date(w.created_at).toLocaleDateString() : '—';
      var lastAct = w.last_activity ? new Date(w.last_activity).toLocaleDateString() : 'No entries yet';
      return '<tr>' +
        '<td><strong>' + esc(w.name) + '</strong><br><small style="color:var(--ink-muted)">@' + esc(w.username) + '</small></td>' +
        '<td><span class="badge">' + esc(w.role) + '</span></td>' +
        '<td>' + (w.total_entries || 0) + '</td>' +
        '<td>' + lastAct + '</td>' +
        '<td>' + created + '</td>' +
      '</tr>';
    }).join('');

    target.innerHTML = '<table><thead><tr><th>Name / User</th><th>Role</th><th>Entries</th><th>Last Active</th><th>Joined</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }catch(e){
    document.getElementById('workers-table-box').innerHTML = '<div class="err">' + e.message + '</div>';
  }
}

function toggleReportFields(){
  var type = document.getElementById('rpt-type').value;
  var vendorBox = document.getElementById('vendor-filter-box');
  if(vendorBox){
    vendorBox.style.display = (type === 'stock') ? 'block' : 'none';
  }
}

function setPreset(p){
  var now = new Date();
  var from = '', to = '';
  if(p === 'today'){
    from = now.toISOString().split('T')[0];
    to = from;
  } else if(p === 'week'){
    var first = now.getDate() - now.getDay();
    from = new Date(now.setDate(first)).toISOString().split('T')[0];
    to = new Date().toISOString().split('T')[0];
  } else if(p === 'month'){
    from = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
    to = new Date().toISOString().split('T')[0];
  } else if(p === 'year'){
    from = new Date(now.getFullYear(), 0, 1).toISOString().split('T')[0];
    to = new Date().toISOString().split('T')[0];
  }
  document.getElementById('rpt-from').value = from;
  document.getElementById('rpt-to').value = to;
  runReport();
}

async function runReport(){
  var type = document.getElementById('rpt-type').value;
  var from = document.getElementById('rpt-from').value;
  var to = document.getElementById('rpt-to').value;
  var cat = document.getElementById('rpt-cat').value;
  var vendorInput = document.getElementById('rpt-vendor');
  var vendor = vendorInput ? vendorInput.value : '';

  toggleReportFields();

  var query = '?from=' + from + '&to=' + to + '&category=' + encodeURIComponent(cat);
  if(type === 'stock') query += '&vendor=' + encodeURIComponent(vendor);

  try{
    var list = await api(type + query);
    var target = document.getElementById('rpt-results');

    if(!list.length){
      target.innerHTML = '<div class="empty">No record found matching this filter.</div>';
      return;
    }

    if(type === 'sales'){
      var totalRev = list.reduce(function(s, x){ return s + (x.total || 0); }, 0);
      var totalQty = list.reduce(function(s, x){ return s + (x.qty || 0); }, 0);
      var rows = list.map(function(s){
        return '<tr><td>' + esc(s.item) + '</td><td>' + esc(s.category) + '</td><td>' + s.qty + '</td><td>' + money(s.total) + '</td><td>' + new Date(s.timestamp).toLocaleDateString() + '</td></tr>';
      }).join('');
      target.innerHTML = '<table><thead><tr><th>Item</th><th>Cat</th><th>Qty</th><th>Total</th><th>Date</th></tr></thead><tbody>' + rows + '</tbody></table>' +
        '<div class="total-card"><span>Total Units: ' + totalQty + '</span><span>Total Sales: ' + money(totalRev) + '</span></div>';
    } else {
      var totalStockQty = list.reduce(function(s, x){ return s + (x.qty || 0); }, 0);
      var rowsStock = list.map(function(s){
        return '<tr><td>' + esc(s.item) + '</td><td>' + esc(s.category) + '</td><td>' + esc(s.vendor || '—') + '</td><td>' + s.qty + '</td><td>' + new Date(s.timestamp).toLocaleDateString() + '</td></tr>';
      }).join('');
      target.innerHTML = '<table><thead><tr><th>Item</th><th>Cat</th><th>Vendor</th><th>Qty</th><th>Date</th></tr></thead><tbody>' + rowsStock + '</tbody></table>' +
        '<div class="total-card"><span>Total Stock Entries: ' + list.length + '</span><span>Total Items Received: ' + totalStockQty + '</span></div>';
    }
  }catch(e){
    document.getElementById('rpt-results').innerHTML = '<div class="err">' + e.message + '</div>';
  }
}

async function addWorker(){
  var name = document.getElementById('nw-name').value.trim();
  var username = document.getElementById('nw-user').value.trim();
  var password = document.getElementById('nw-pass').value;
  var errEl = document.getElementById('nw-err');
  errEl.textContent = '';
  if(!name || !username || !password){ errEl.textContent = 'Please fill out all fields.'; return; }
  try{
    await api('workers', { method:'POST', body: JSON.stringify({name: name, username: username, password: password}) });
    alert('Worker account created successfully!');
    document.getElementById('nw-name').value = '';
    document.getElementById('nw-user').value = '';
    document.getElementById('nw-pass').value = '';
    loadWorkersRoster();
  }catch(e){ errEl.textContent = e.message; }
}

async function resetWorkerPwd(){
  var user = document.getElementById('rw-user').value.trim();
  var pass = document.getElementById('rw-pass').value;
  var errEl = document.getElementById('rw-err');
  errEl.textContent = '';
  if(!user || !pass){ errEl.textContent = 'Enter username and password.'; return; }
  try{
    await api('workers/reset-password', { method:'POST', body: JSON.stringify({username: user, password: pass}) });
    alert('Password reset successful!');
    document.getElementById('rw-user').value = '';
    document.getElementById('rw-pass').value = '';
  }catch(e){ errEl.textContent = e.message; }
}

boot();
</script>
