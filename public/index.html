<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WatchPlugNG — Manager & Sales Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #241F16;
    --ink-muted: #7A7361;
    --paper: #FAF7F0;
    --card: #FFFFFF;
    --line: #E7DFCB;
    --gold: #8B6F2F;
    --gold-light: #C9A76A;
    --gold-hover: #6F5824;
    --input-bg: #FBF9F3;
    --focus: rgba(139, 111, 47, 0.35);
    --danger: #b33;
    --success: #28a745;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Manrope', sans-serif;
  }

  #app {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px 16px;
  }

  .dial {
    position: relative;
    width: 90px;
    height: 90px;
    margin-bottom: 16px;
    flex-shrink: 0;
  }
  .dial-ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(139, 111, 47, 0.35); }
  .tick { position: absolute; left: 50%; top: 50%; width: 2px; border-radius: 1px; transform-origin: 50% 50%; }
  .tick.major { height: 14px; background: var(--gold); }
  .tick.minor { height: 7px; width: 1.5px; background: #C9BFA0; }
  .hand {
    position: absolute; left: 50%; top: 50%; width: 2px; height: 30px;
    background: var(--gold); border-radius: 1px; transform-origin: 50% 100%;
    transform: translate(-50%, -100%) rotate(0deg); animation: sweep 9s linear infinite;
  }
  .pivot { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; background: var(--gold); border-radius: 50%; transform: translate(-50%, -50%); }
  @keyframes sweep { from { transform: translate(-50%, -100%) rotate(0deg); } to { transform: translate(-50%, -100%) rotate(360deg); } }

  .screen { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; }

  h1.wordmark { margin: 0; font-family: 'Fraunces', serif; font-weight: 600; font-size: 24px; text-align: center; }
  .subtitle { margin-top: 4px; font-size: 13px; color: var(--ink-muted); text-align: center; }

  .card {
    margin-top: 16px;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-card { background: var(--input-bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .stat-card .label { font-size: 11px; color: var(--ink-muted); text-transform: uppercase; font-weight: 600; }
  .stat-card .value { font-size: 20px; font-weight: 700; margin-top: 4px; color: var(--ink); }

  .item-list-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .item-list-row:last-child { border-bottom: none; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; color: var(--ink-muted); }

  input, select {
    height: 44px; width: 100%; border-radius: 10px; border: 1px solid var(--line);
    background: var(--input-bg); color: var(--ink); font-size: 14px; font-family: 'Manrope', sans-serif; padding: 0 12px;
  }
  input:focus, select:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--focus); }

  .password-wrap { position: relative; width: 100%; }
  .password-wrap input { padding-right: 42px; }
  .toggle-visibility { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: none; background: transparent; cursor: pointer; color: var(--ink-muted); }

  button.submit {
    height: 44px; border-radius: 10px; border: none; background: var(--gold); color: #FFFDF8;
    font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  button.submit:hover { background: var(--gold-hover); }

  button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 6px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 12px; }

  .tabs { display: flex; gap: 8px; margin: 16px 0; overflow-x: auto; width: 100%; padding-bottom: 4px; }
  .tab { padding: 8px 14px; border-radius: 20px; border: 1px solid var(--line); font-size: 0.8rem; cursor: pointer; white-space: nowrap; background: var(--card); }
  .tab.active { background: var(--gold); color: #fff; border-color: var(--gold); }

  .badge { padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
  .badge.success { background: #E6F4EA; color: #137333; }
  .badge.danger { background: #FCE8E6; color: #C5221F; }

  .dashboard { width: 100%; max-width: 500px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 10px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--ink-muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
  .err { color: var(--danger); font-size: 0.85rem; margin-top: 4px; }
  .empty { color: var(--ink-muted); font-size: 0.85rem; text-align: center; padding: 20px 0; }
  .wa-btn { background: #25D366; color: white; padding: 4px 8px; border-radius: 6px; text-decoration: none; font-size: 0.75rem; font-weight: 600; }
  .footnote { margin-top: 24px; font-size: 11px; color: #B3AB94; text-align: center; }
</style>
</head>
<body>

<div id="app"><div class="empty">Loading…</div></div>

<script>
const CATEGORIES = ['Wrist Watches','Cufflinks','Jersey Scarves','Sneakers','Jewellery'];
const PAY_METHODS = ['Bank Transfer', 'POS / Card', 'Cash'];
const app = document.getElementById('app');
let user = null, token = localStorage.getItem('st_token');
let ownerTab = 'dash';

const money = function(n){ return '₦' + Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2}); };
const esc = function(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
const catOpts = function(includeAll){ 
  var opts = CATEGORIES.map(function(c){ return '<option value="' + c + '">' + c + '</option>'; }).join('');
  return includeAll ? '<option value="">All Categories</option>' + opts : opts;
};

function brandDialHeader(){
  return '<div class="dial" aria-hidden="true">' +
    '<div class="dial-ring"></div>' +
    '<div class="hand"></div><div class="pivot"></div>' +
  '</div>' +
  '<h1 class="wordmark">WatchPlugNG</h1>';
}

function pwdInputHtml(id, placeholder){
  return '<div class="password-wrap">' +
    '<input id="' + id + '" type="password" placeholder="' + (placeholder||'Password') + '" required>' +
    '<button type="button" class="toggle-visibility" onclick="togglePwd(\'' + id + '\', this)">👁</button>' +
  '</div>';
}

function togglePwd(inputId, btn){
  var el = document.getElementById(inputId);
  el.type = el.type === 'password' ? 'text' : 'password';
}

async function api(path, opts){
  opts = opts || {};
  var headers = { 'Content-Type':'application/json' };
  if(token) headers['Authorization'] = 'Bearer ' + token;
  var res = await fetch('/api/' + path, Object.assign({}, opts, { headers: headers }));
  var data = await res.json().catch(function(){ return {}; });
  if(!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

async function boot(){
  if(token){
    try{ user = await api('me'); }
    catch(e){ token = null; localStorage.removeItem('st_token'); }
  }
  if(!user){
    try{
      var res = await api('has-workers');
      if(!res.exists){ renderSetup(); return; }
    }catch(e){}
    renderLogin();
    return;
  }
  render();
}

function render(){ user.role === 'owner' ? renderOwner() : renderWorker(); }

function renderSetup(){
  app.innerHTML = '<div class="screen">' +
    brandDialHeader() +
    '<div class="subtitle">First-time setup — create owner account</div>' +
    '<form class="card" id="setupForm">' +
      '<div class="field"><label>Your name</label><input id="s-name" required></div>' +
      '<div class="field"><label>Username</label><input id="s-user" required></div>' +
      '<div class="field"><label>Password</label>' + pwdInputHtml('s-pass') + '</div>' +
      '<div id="s-err" class="err"></div>' +
      '<button type="submit" class="submit">Create Account</button>' +
    '</form>' +
  '</div>';

  document.getElementById('setupForm').onsubmit = async function(e){
    e.preventDefault();
    try{
      await api('setup', { method:'POST', body: JSON.stringify({name: document.getElementById('s-name').value.trim(), username: document.getElementById('s-user').value.trim(), password: document.getElementById('s-pass').value}) });
      var r = await api('login', { method:'POST', body: JSON.stringify({username: document.getElementById('s-user').value.trim(), password: document.getElementById('s-pass').value}) });
      token = r.token; localStorage.setItem('st_token', token); user = r;
      render();
    }catch(err){ document.getElementById('s-err').textContent = err.message; }
  };
}

function renderLogin(){
  app.innerHTML = '<div class="screen">' +
    brandDialHeader() +
    '<div class="subtitle">Log in to record or view sales</div>' +
    '<form class="card" id="loginForm">' +
      '<div class="field"><label>Username</label><input id="l-user" required></div>' +
      '<div class="field"><label>Password</label>' + pwdInputHtml('l-pass') + '</div>' +
      '<div id="l-err" class="err"></div>' +
      '<button type="submit" class="submit">Log in</button>' +
    '</form>' +
  '</div>';

  document.getElementById('loginForm').onsubmit = async function(e){
    e.preventDefault();
    try{
      var r = await api('login', { method:'POST', body: JSON.stringify({username: document.getElementById('l-user').value.trim(), password: document.getElementById('l-pass').value}) });
      token = r.token; localStorage.setItem('st_token', token); user = r;
      render();
    }catch(err){ document.getElementById('l-err').textContent = err.message; }
  };
}

async function logout(){
  try{ await api('logout', { method:'POST' }); }catch(e){}
  token = null; user = null; localStorage.removeItem('st_token');
  renderLogin();
}

function saleFormHtml(){
  var pmOpts = PAY_METHODS.map(function(m){ return '<option value="' + m + '">' + m + '</option>'; }).join('');
  return '<div class="field"><label>Category</label><select id="w-cat">' + catOpts(false) + '</select></div>' +
    '<div class="field"><label>Item Name</label><input id="w-item" placeholder="e.g. Rolex Datejust 41"></div>' +
    '<div class="stat-grid">' +
      '<div class="field"><label>Price (₦)</label><input id="w-price" type="number" min="0"></div>' +
      '<div class="field"><label>Quantity</label><input id="w-qty" type="number" min="1" value="1"></div>' +
    '</div>' +
    '<div class="field"><label>Payment Method</label><select id="w-pay">' + pmOpts + '</select></div>' +
    '<div class="stat-grid">' +
      '<div class="field"><label>Customer Name</label><input id="w-cname" placeholder="Optional"></div>' +
      '<div class="field"><label>WhatsApp Phone</label><input id="w-cphone" placeholder="e.g. 2348180000000"></div>' +
    '</div>' +
    '<div id="w-err" class="err"></div>' +
    '<button type="button" class="submit" id="w-btn">Log Sale</button>';
}

function wireSaleForm(onDone){
  document.getElementById('w-btn').onclick = async function(){
    var category = document.getElementById('w-cat').value;
    var item = document.getElementById('w-item').value.trim();
    var price = parseFloat(document.getElementById('w-price').value);
    var qty = parseInt(document.getElementById('w-qty').value, 10) || 1;
    var payment_method = document.getElementById('w-pay').value;
    var customer_name = document.getElementById('w-cname').value.trim();
    var customer_phone = document.getElementById('w-cphone').value.trim();

    var errEl = document.getElementById('w-err');
    if(!item || isNaN(price) || price < 0){ errEl.textContent = 'Fill in item and a valid price.'; return; }
    try{
      await api('sales', { method:'POST', body: JSON.stringify({
        category: category, item: item, price: price, qty: qty, 
        payment_method: payment_method, customer_name: customer_name, customer_phone: customer_phone
      }) });
      onDone();
    }catch(err){ errEl.textContent = err.message; }
  };
}

async function renderWorker(){
  app.innerHTML = '<div class="dashboard">' +
    '<div class="row"><h1>Hi, ' + esc(user.name) + '</h1><button class="secondary" onclick="logout()">Log out</button></div>' +
    '<div class="card">' + saleFormHtml() + '</div>' +
    '<div class="subtitle" style="text-align:left; margin: 20px 0 10px;">Your recent sales</div>' +
    '<div class="card table-wrap" id="w-list"><div class="empty">Loading…</div></div>' +
  '</div>';

  wireSaleForm(renderWorker);
  try{
    var mine = await api('sales');
    document.getElementById('w-list').innerHTML = mine.length ? salesHistoryList(mine) : '<div class="empty">No sales logged yet.</div>';
  }catch(e){}
}

function salesHistoryList(list){
  return list.map(function(s){
    return '<div class="item-list-row">' +
      '<div>' +
        '<strong>' + esc(s.item) + '</strong><br>' +
        '<small style="color:var(--ink-muted)">' + new Date(s.timestamp).toLocaleDateString() + ' • ' + esc(s.payment_method||'Transfer') + '</small>' +
      '</div>' +
      '<div style="text-align:right;">' +
        '<strong>' + money(s.total) + '</strong><br>' +
        '<small style="color:var(--ink-muted)">Qty: ' + s.qty + '</small>' +
      '</div>' +
    '</div>';
  }).join('');
}

async function renderOwner(){
  app.innerHTML = '<div class="dashboard">' +
    '<div class="row"><h1>WatchPlugNG</h1><button class="secondary" onclick="logout()">Log out</button></div>' +
    '<div class="tabs">' +
      '<div class="tab ' + (ownerTab==='dash'?'active':'') + '" onclick="switchTab(\'dash\')">Dashboard</div>' +
      '<div class="tab ' + (ownerTab==='inventory'?'active':'') + '" onclick="switchTab(\'inventory\')">Inventory</div>' +
      '<div class="tab ' + (ownerTab==='history'?'active':'') + '" onclick="switchTab(\'history\')">Sales History</div>' +
      '<div class="tab ' + (ownerTab==='stock'?'active':'') + '" onclick="switchTab(\'stock\')">+ Stock</div>' +
      '<div class="tab ' + (ownerTab==='workers'?'active':'') + '" onclick="switchTab(\'workers\')">Workers</div>' +
      '<div class="tab ' + (ownerTab==='log'?'active':'') + '" onclick="switchTab(\'log\')">+ Sale</div>' +
    '</div>' +
    '<div id="tab-content"></div>' +
  '</div>';
  await renderOwnerTab();
}

function switchTab(t){ ownerTab = t; renderOwner(); }

async function renderOwnerTab(){
  var el = document.getElementById('tab-content');
  
  // 1. Dashboard View
  if(ownerTab === 'dash'){
    el.innerHTML = '<div class="empty">Loading dashboard summary…</div>';
    try {
      var d = await api('dashboard-summary');
      var dateStr = new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
      el.innerHTML = '<div class="subtitle" style="text-align:left;">Today, ' + dateStr + '</div>' +
        '<div class="stat-grid" style="margin-top:10px;">' +
          '<div class="stat-card"><div class="label">Today Sales</div><div class="value">' + money(d.today_sales) + '</div></div>' +
          '<div class="stat-card"><div class="label">Items Sold</div><div class="value">' + d.items_sold + '</div></div>' +
        '</div>' +
        '<div class="card">' +
          '<div class="label" style="font-size:11px; color:var(--ink-muted); text-transform:uppercase;">Top Seller This Month</div>' +
          '<strong>' + esc(d.top_seller) + '</strong>' +
        '</div>' +
        '<div class="subtitle" style="text-align:left; margin: 16px 0 8px;">Recent Sales</div>' +
        '<div class="card">' + (d.recent_sales.length ? salesHistoryList(d.recent_sales) : '<div class="empty">No recent sales</div>') + '</div>';
    } catch(e){ el.innerHTML = '<div class="err">' + e.message + '</div>'; }

  // 2. Inventory Balances View
  } else if(ownerTab === 'inventory'){
    el.innerHTML = '<div class="empty">Loading inventory balances…</div>';
    try {
      var inv = await api('inventory-balances');
      var rows = inv.map(function(item){
        var badge = item.remaining_qty > 2 ? '<span class="badge success">' + item.remaining_qty + ' In Stock</span>' : '<span class="badge danger">' + item.remaining_qty + ' Low Stock</span>';
        return '<div class="item-list-row">' +
          '<div><strong>' + esc(item.item) + '</strong><br><small style="color:var(--ink-muted)">' + esc(item.category) + '</small></div>' +
          '<div>' + badge + '</div>' +
        '</div>';
      }).join('');
      el.innerHTML = '<div class="card">' + (inv.length ? rows : '<div class="empty">No inventory items recorded yet.</div>') + '</div>';
    } catch(e){ el.innerHTML = '<div class="err">' + e.message + '</div>'; }

  // 3. Sales History View
  } else if(ownerTab === 'history'){
    el.innerHTML = '<div class="empty">Loading sales history…</div>';
    try {
      var history = await api('sales');
      el.innerHTML = '<div class="card">' + (history.length ? salesHistoryList(history) : '<div class="empty">No sales history available.</div>') + '</div>';
    } catch(e){ el.innerHTML = '<div class="err">' + e.message + '</div>'; }

  // 4. Stock Intake Tab
  } else if(ownerTab === 'stock'){
    el.innerHTML = '<div class="card">' +
      '<h3>Add Stock Intake</h3>' +
      '<div class="field"><label>Category</label><select id="st-cat">' + catOpts(false) + '</select></div>' +
      '<div class="field"><label>Item Name</label><input id="st-item" placeholder="e.g. Casio Edifice EFR-556"></div>' +
      '<div class="field"><label>Vendor</label><input id="st-vendor" placeholder="Supplier name"></div>' +
      '<div class="field"><label>Quantity</label><input id="st-qty" type="number" value="1"></div>' +
      '<button type="button" class="submit" id="st-btn">Save Stock Intake</button>' +
    '</div>';
    document.getElementById('st-btn').onclick = async function(){
      await api('stock', { method:'POST', body: JSON.stringify({
        category: document.getElementById('st-cat').value,
        item: document.getElementById('st-item').value,
        vendor: document.getElementById('st-vendor').value,
        qty: parseInt(document.getElementById('st-qty').value, 10)
      })});
      alert('Stock added successfully!');
    };

  // 5. Workers Roster Tab
  } else if(ownerTab === 'workers'){
    el.innerHTML = '<div class="card">' +
      '<h3>Add New Worker</h3>' +
      '<div class="field"><label>Full Name</label><input id="nw-name"></div>' +
      '<div class="field"><label>Username</label><input id="nw-user"></div>' +
      '<div class="field"><label>Password</label>' + pwdInputHtml('nw-pass') + '</div>' +
      '<div id="nw-err" class="err"></div>' +
      '<button type="button" class="submit" onclick="addWorker()">Create Account</button>' +
    '</div>' +
    '<div class="card table-wrap" id="workers-list-card"><h3>Team Activity Roster</h3><div id="workers-table-box">Loading…</div></div>';
    loadWorkersRoster();

  // 6. Log Sale Tab
  } else if(ownerTab === 'log'){
    el.innerHTML = '<div class="card">' + saleFormHtml() + '</div>';
    wireSaleForm(function(){ ownerTab = 'history'; renderOwner(); });
  }
}

async function loadWorkersRoster(){
  try{
    var list = await api('workers');
    var target = document.getElementById('workers-table-box');
    var rows = list.map(function(w){
      return '<tr><td><strong>' + esc(w.name) + '</strong></td><td>' + (w.total_entries || 0) + '</td></tr>';
    }).join('');
    target.innerHTML = '<table><thead><tr><th>Name</th><th>Sales Logged</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }catch(e){}
}

async function addWorker(){
  var name = document.getElementById('nw-name').value.trim();
  var username = document.getElementById('nw-user').value.trim();
  var password = document.getElementById('nw-pass').value;
  try{
    await api('workers', { method:'POST', body: JSON.stringify({name: name, username: username, password: password}) });
    alert('Worker account created!');
    loadWorkersRoster();
  }catch(e){ document.getElementById('nw-err').textContent = e.message; }
}

boot();
</script>
</body>
</html>
