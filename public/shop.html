<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog | WatchPlug NG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-gold: #d97706;
            --accent-green: #10b981;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 1.5rem 1rem;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto 2rem auto;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .brand { font-size: 1.5rem; font-weight: 700; color: var(--text-main); text-decoration: none; }
        .brand span { color: var(--accent-gold); }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        .catalog-title { margin-bottom: 1.5rem; text-align: center; }
        .catalog-title h2 { font-size: 1.8rem; }
        .catalog-title p { color: var(--text-muted); font-size: 0.95rem; }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #1f2937;
        }

        .product-details { padding: 1.25rem; }

        .product-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; }

        .product-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 1rem;
        }

        .btn-group { display: flex; flex-direction: column; gap: 0.5rem; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            border: none;
        }

        .btn-whatsapp { background-color: #25D366; color: #ffffff; }
        .btn-checkout { background-color: var(--accent-gold); color: #ffffff; }

        footer { text-align: center; margin-top: 3rem; color: var(--text-muted); font-size: 0.85rem; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="brand">WATCHPLUG <span>NG</span></a>
        <a href="/" class="back-link">← Home</a>
    </nav>

    <div class="container">
        <div class="catalog-title">
            <h2>Available Collection</h2>
            <p>Select a timepiece to order directly via WhatsApp or checkout online</p>
        </div>

        <div class="product-grid">
            <!-- Sample Product 1 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/300x220?text=Watch+Image" alt="Watch" class="product-img">
                <div class="product-details">
                    <div class="product-title">Rolex Datejust Gold</div>
                    <div class="product-price">₦185,000</div>
                    <div class="btn-group">
                        <a href="https://wa.me/2348180506376?text=Hi%20WatchPlug,%20I%20want%20to%20buy%20the%20Rolex%20Datejust%20Gold%20for%20N185,000" target="_blank" class="btn btn-whatsapp">
                            Order on WhatsApp
                        </a>
                        <button onclick="alert('Online checkout coming soon!')" class="btn btn-checkout">
                            Pay Online
                        </button>
                    </div>
                </div>
            </div>

            <!-- Sample Product 2 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/300x220?text=Watch+Image" alt="Watch" class="product-img">
                <div class="product-details">
                    <div class="product-title">Emporio Armani Chronograph</div>
                    <div class="product-price">₦65,000</div>
                    <div class="btn-group">
                        <a href="https://wa.me/2348180506376?text=Hi%20WatchPlug,%20I%20want%20to%20buy%20the%20Emporio%20Armani%20for%20N65,000" target="_blank" class="btn btn-whatsapp">
                            Order on WhatsApp
                        </a>
                        <button onclick="alert('Online checkout coming soon!')" class="btn btn-checkout">
                            Pay Online
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Example Product Card -->
<div class="product-card">
    <!-- Replace the image src with your uploaded file name -->
    <img src="/shopping.webp" alt="Rolex Datejust Gold" class="product-img">
    
    <div class="product-details">
        <div class="product-title">Rolex Datejust Gold</div>
        <div class="product-price">₦185,000</div>
        <div class="btn-group">
            <a href="https://wa.me/2348180506376?text=Hi%20WatchPlug,%20I%20want%20to%20buy%20the%20Rolex%20Datejust%20Gold%20for%20N185,000" target="_blank" class="btn btn-whatsapp">
                Order on WhatsApp
            </a>
            <button onclick="alert('Online checkout coming soon!')" class="btn btn-checkout">
                Pay Online
            </button>
        </div>
    </div>
</div>


    <footer>
        &copy; WatchPlug NG. All rights reserved.
    </footer>

</body>
</html>
